<header class="bg-white shadow-md py-4">
    <div class="w-full px-4">
        <h1 class="text-3xl font-extrabold text-blue-900 dark:text-blue-400 md:text-4xl">
            <span class="bg-gradient-to-r from-sky-400 to-blue-600 bg-clip-text text-transparent">
                CICLO DE VIDA
            </span>
        </h1>
    </div>
</header>

<div class="container mx-auto my-6 p-4 bg-white shadow-md rounded-lg">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Lista de Ciclos</h2>
      <button class="bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 px-4 rounded flex items-center text-base">
        <i class="fas fa-plus mr-2"></i> Agregar Ciclo
      </button>
    </div>
  
    <!-- Switcher de Estado -->
      <div class="flex items-center mb-4">
        <span class="mr-2 font-semibold">Mostrar:</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" class="sr-only peer" [(ngModel)]="statusActive" (change)="toggleStatus()">
          <div class="w-11 h-6 bg-gray-200 peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
          <span class="ml-3 text-sm font-medium text-gray-900">{{ statusFilter === 'A' ? 'Activos' : 'Inactivos' }}</span>
        </label>
      </div>
  <!-- Modal de edición -->
<div *ngIf="cicloSeleccionado" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h3 class="text-xl font-bold mb-4">Editar Ciclo</h3>
  
      <label class="block mb-2">Nombre del ciclo</label>
      <input type="text" class="w-full border p-2 rounded" [(ngModel)]="cicloSeleccionado.nameIto">
  
      <label class="block mt-4 mb-2">Estado</label>
      <select class="w-full border p-2 rounded" [(ngModel)]="cicloSeleccionado.status">
        <option value="A">Activo</option>
        <option value="I">Inactivo</option>
      </select>
  
      <div class="mt-4 flex justify-end space-x-2">
        <button class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded" (click)="cicloSeleccionado = null">Cancelar</button>
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" (click)="guardarEdicion()">Guardar</button>
      </div>
    </div>
  </div>
  
  
    <div class="overflow-x-auto">
      <table class="min-w-full border-separate border-spacing-y-2 text-base">
        <thead>
          <tr>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">ID</th>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">Tipo de ITO</th>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">Nombre de ITO</th>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">Tipo de Tiempo</th>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">Tiempo</th>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">Estado</th>
            <th class="px-4 py-3 font-semibold text-blue-900 bg-blue-100">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ciclo of paginaCiclos" class="bg-gray-50 hover:bg-gray-100 text-center">
            <td class="px-4 py-3">{{ ciclo.id }}</td>
            <td class="px-4 py-3">{{ ciclo.typeIto }}</td>
            <td class="px-4 py-3">{{ ciclo.nameIto }}</td>
            <td class="px-4 py-3">{{ ciclo.typeTime }}</td>
            <td class="px-4 py-3">{{ ciclo.times }}</td>
            <td class="px-4 py-3">
              <span 
                class="inline-flex w-5 h-5 rounded-full"
                [ngClass]="{'bg-green-500': ciclo.status === 'A', 'bg-red-500': ciclo.status === 'I'}">
              </span>
            </td>
            <td class="px-4 py-3 flex justify-center space-x-2">
                <button class="text-blue-500 hover:text-blue-700 text-lg" (click)="editarCiclo(ciclo)">
                    <i class="fas fa-edit"></i>
                  </button>
              <button class="text-red-500 hover:text-red-700 text-lg">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
